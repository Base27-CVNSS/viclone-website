name: Báo lỗi
description: Báo cáo lỗi hoặc hành vi không mong đợi
title: "[Lỗi]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã dành thời gian báo lỗi. Vui lòng cung cấp đủ thông tin để chúng tôi có thể tái hiện và xử lý vấn đề.

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Mô tả ngắn gọn và rõ ràng vấn đề bạn gặp phải.
      placeholder: Điều gì đã xảy ra?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Các bước tái hiện
      description: Liệt kê từng bước để tái hiện lỗi.
      placeholder: |
        1. Chạy `/clone-website https://example.com`
        2. Chờ agent hoàn tất
        3. Quan sát lỗi trong terminal...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
      description: Bạn mong hệ thống hoạt động như thế nào?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
      description: Điều gì thực sự xảy ra? Hãy đính kèm thông báo lỗi hoặc ảnh chụp nếu có.
    validations:
      required: true

  - type: input
    id: target-url
    attributes:
      label: URL mục tiêu
      description: Website bạn đang thử tái dựng, nếu phù hợp. Không gửi URL chứa thông tin nhạy cảm hoặc truy cập riêng tư.
      placeholder: https://example.com

  - type: dropdown
    id: os
    attributes:
      label: Hệ điều hành
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Phiên bản Node.js
      description: Chạy `node -v` để kiểm tra.
      placeholder: v24.x.x
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: AI coding agent và phiên bản
      description: Ví dụ Claude Code, Codex CLI, Cursor, Gemini CLI... kèm phiên bản nếu có.
      placeholder: Claude Code 1.x.x

  - type: textarea
    id: additional
    attributes:
      label: Thông tin bổ sung
      description: Log, ảnh chụp, video hoặc ngữ cảnh khác. Hãy xóa token, cookie, secret và dữ liệu cá nhân trước khi gửi.
