name: Đề xuất tính năng
description: Đề xuất tính năng mới hoặc cải tiến cho ViClone Website
title: "[Tính năng]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã đề xuất cải tiến. Hãy mô tả vấn đề thực tế trước, sau đó trình bày giải pháp bạn mong muốn.

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
      description: Tính năng này giải quyết khó khăn nào? Điều gì hiện còn thiếu hoặc gây bất tiện?
      placeholder: "Tôi thường gặp khó khăn khi..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Giải pháp đề xuất
      description: Bạn muốn tính năng hoạt động như thế nào?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Phương án khác đã cân nhắc
      description: Bạn đã thử hoặc nghĩ đến cách tiếp cận nào khác?

  - type: dropdown
    id: category
    attributes:
      label: Nhóm tính năng
      options:
        - Quy trình tái dựng website
        - Trích xuất asset và design token
        - Sinh component
        - Visual QA và kiểm thử
        - Tài liệu
        - Trải nghiệm lập trình viên
        - Hỗ trợ AI coding agent
        - Khác

  - type: textarea
    id: additional
    attributes:
      label: Thông tin bổ sung
      description: Ảnh chụp, mockup, link tham chiếu hoặc ngữ cảnh liên quan. Không gửi secret, token, cookie hoặc dữ liệu riêng tư.
